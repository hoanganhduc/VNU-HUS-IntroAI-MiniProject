name: Project topic proposal
description: Publish one class-visible proposal summary for a final-project group.
title: "[Proposal] "
labels:
  - "status: pending"
body:
  - type: markdown
    attributes:
      value: |
        Use one issue for the entire project. Do not include student IDs, email addresses, phone numbers, credentials, or unnecessary personal information. The linked private commit is the authoritative full proposal.

  - type: input
    id: group_name
    attributes:
      label: Group name
      description: Use the same group name as team.json.
      placeholder: Example group name
    validations:
      required: true

  - type: input
    id: founder
    attributes:
      label: Founder GitHub username
      description: Enter the username of the student who accepted the Classroom50 assignment.
      placeholder: github-username
    validations:
      required: true

  - type: textarea
    id: members
    attributes:
      label: All member GitHub usernames
      description: List one to five approved usernames, including the founder, one per line.
      placeholder: |
        github-username-1
        github-username-2
    validations:
      required: true

  - type: input
    id: project_title
    attributes:
      label: Project title
      placeholder: Project title
    validations:
      required: true

  - type: dropdown
    id: topic_source
    attributes:
      label: Topic source
      options:
        - Based on one suggested idea
        - Combines or adapts suggested ideas
        - Self-proposed
    validations:
      required: true

  - type: textarea
    id: public_summary
    attributes:
      label: Class-visible summary
      description: Summarize the problem, motivation, and intended result without private information.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Student-defined scope and feasibility
      description: State what the group intends to complete, what it does not promise, and why the plan is feasible.
    validations:
      required: true

  - type: textarea
    id: method_resources
    attributes:
      label: Planned method, data, tools, and sources
      description: Identify the planned approach and the important external resources.
    validations:
      required: true

  - type: textarea
    id: overlap
    attributes:
      label: Relationship to existing proposals
      description: State which listed proposals are closest and how this project differs. Write “No close proposal found” when appropriate.
    validations:
      required: true

  - type: input
    id: proposal_commit
    attributes:
      label: Exact Classroom50 proposal commit URL
      description: Paste the permanent GitHub URL or complete 40-character SHA for the commit named “Submit topic proposal”.
      placeholder: https://github.com/VNU-HUS/.../commit/...
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: Every listed member agreed to this group and proposal.
          required: true
        - label: The group reviewed existing topic issues before submitting.
          required: true
        - label: External ideas, papers, datasets, libraries, models, and repositories are identified in the full proposal.
          required: true
        - label: The group chose and justified its own project scope and feasibility.
          required: true
